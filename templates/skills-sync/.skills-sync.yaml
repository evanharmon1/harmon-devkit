# .skills-sync.yaml — declares which shared agent skills THIS repo vendors from
# harmon-devkit, pinned to a tag. Copy it to your repo root, edit the categories
# and ref, then run `task sync:skills`. See templates/skills-sync/README.md.
source:
  repo: https://github.com/evanharmon1/harmon-devkit.git
  ref: v0.17.0 # pinned tag — pin to a real released harmon-devkit tag, bump deliberately
  # path: ai/skills   # optional; where skills live in the source (this is the default)
categories:
  - universal
  - frontend
dest: .claude/skills # Claude-first default; expose it through .agents/skills for other harnesses

# OPTIONAL. Delete this block and the sync behaves exactly as it did before
# agents existed. Agents ride the SAME pinned ref as skills on purpose: a shared
# agent is thin and defers to a skill by reading it, so letting the two pin
# separately would leave an agent following a procedure that no longer exists.
agents:
  names: [implementer] # explicit list, or ["*"] for every agent at the pin
  dest: .claude/agents # must differ from the skills dest above

# OPTIONAL. Delete this block and the sync behaves exactly as it did before
# schemas existed. Schemas ride the SAME pinned ref as skills/agents: a role's
# result is only valid against the schema version a vendored skill or agent at
# that pin actually targets, so letting schemas drift to a different pin could
# leave a vendored skill emitting a shape its own vendored schema no longer
# describes.
schemas:
  names: ["*"] # explicit list of schema basenames (no .schema.json), or ["*"] for every schema at the pin
  dest: .claude/schemas # must differ from the skills/agents dest above
