name: Build & Validate

on:
  push:
    branches:
      - main
  # No `edited`: it fires on a PR title/body edit, and the dev loop's readiness
  # gate REQUIRES body edits (ticking `## Deferred findings`), so carrying it
  # here made satisfying one gate condition invalidate another — every
  # settlement restarted the whole matrix. `edited` also fires on a
  # base-BRANCH change; dropping that re-run is deliberate. Retargeting a PR
  # is rare, and a strict required-status-checks policy already forces an
  # up-to-date head before merge, which lands as a `synchronize` this list
  # does cover. Title/body-dependent guards keep `edited` in their OWN
  # workflows: closing-keywords.yml and release-content-guard.yml.
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  merge_group:
  workflow_dispatch:

# Parallel jobs that all call into the Taskfile so local + CI run identical commands.
# A final `verify` job aggregates statuses for branch protection
# (required checks: verify + security). Every job's toolchain setup goes through
# the shared ./.github/actions/setup composite action.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `task check`'s pin-pair guard can diff against the
          # PR's merge-base: it is the only check that catches a Renovate bump
          # that moved a tool's version but not its checksum, and it fails
          # rather than skipping on a pull request without that history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
          # test:render-dev-flow exercises render-dev-flow.mjs's secret-scan
          # step, which shells out to gitleaks — without this the new test
          # target below would fail for a missing binary, not a real defect.
          gitleaks: "true"
      - name: Install devkit test tools
        run: |
          # yq comes from the setup action above (lint-tools: "true") — do not
          # re-install it here.
          # renovate: datasource=pypi depName=copier
          COPIER_VERSION=9.18.2
          python -m pip install "copier==${COPIER_VERSION}"
      - name: Lint
        run: task check
      # Outside the suite: `audit:*` is not a `test:*` target, so `test:suite`
      # does not carry it, and `verify` runs it between `check` and the suite.
      - run: task audit:agent-instructions
      # Its own step, outside the suite it guards: it is also a suite member (so
      # `verify` runs it), but deleting the suite step below would delete the
      # only CI step that could notice — this one still fails then.
      - name: Verify-CI parity guard (runs outside the suite it guards)
        run: task test:verify-ci-parity
      # The ONE step for every `test:*` target `task verify` runs. The list
      # lives in Taskfile.yml's `test:suite` and nowhere else, so a check added
      # to `verify` can no longer be missed here (harmon-init#962, #1461) —
      # each entry carries the same answer gate in both places.
      # `test:verify-ci-parity` (the step above) fails if this step is ever
      # dropped.
      #
      # General-profile consumers have no build-test job. This skills source
      # therefore runs its native validate/test tiers explicitly below.
      - name: Test suite (every test:* target verify runs)
        run: task test:suite
      # This is the skills source: native skill tests run through test:suite and
      # task test; dogfood links intentionally do not self-vendor.
      - run: task validate
      - run: task test
      # Outside the suite, on purpose: a `ci`-only unit check, not in `verify`.
      - run: task test:devcontainer:permissions

  security:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          gitleaks: "true"
      - name: Secrets scan
        run: task security:secrets
      - name: Dependency audit
        run: task security:audit
      - name: SAST (Semgrep Community Edition)
        run: task security:sast

  closing-keywords:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: No PR closing-reference check is needed for this trigger
        if: github.event_name != 'pull_request'
        run: echo "Closing-keyword guard applies to pull requests only."
      - name: Require completed issues before a same-repo closing reference
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          commits_file=$(mktemp)
          trap 'rm -f "$commits_file" ./check-closing-keywords.sh ./lib/gh-rest.sh; rmdir ./lib 2>/dev/null || :' EXIT
          if [ "$PR_COMMITS" -gt 250 ]; then
            echo "::error::PR has ${PR_COMMITS} commits, exceeding the 250-commit API limit; closing-keyword result is indeterminate" >&2
            exit 1
          fi
          gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.message' > "$commits_file"
          fetch_error=$(mktemp)
          mkdir -p ./lib
          # The guard SOURCES scripts/lib/gh-rest.sh, so the library is fetched
          # with it, from the SAME ref and under the same trust rules below: a
          # script paired with another ref's library is a program nobody
          # reviewed. It lands at ./lib/ because that is where the guard's own
          # "${script_dir}/lib/gh-rest.sh" resolves. Either fetch failing fails
          # the pair, so the rules below decide about the pair, not one file.
          fetch_script() {
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${GH_REPO}/contents/scripts/check-closing-keywords.sh?ref=$1" \
              > ./check-closing-keywords.sh 2>"$fetch_error" || return 1
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${GH_REPO}/contents/scripts/lib/gh-rest.sh?ref=$1" \
              > ./lib/gh-rest.sh 2>"$fetch_error" || return 1
          }
          # Workflow definitions are taken from the default branch for PRs.
          # Prefer that trusted program even if this PR edits it. The one
          # bootstrap exception lets the introducing PR run only after a
          # confirmed 404, and only for a same-repository head. A fork never
          # executes head-controlled code; network/auth errors never fall back.
          if ! fetch_script "$DEFAULT_BRANCH"; then
            if grep -q '(HTTP 404)' "$fetch_error" && [ "$HEAD_REPO" = "$GH_REPO" ]; then
              echo '::notice::the default-branch guard program is incomplete; using same-repo PR head for bootstrap'
              fetch_script "$HEAD_SHA"
            else
              cat "$fetch_error" >&2
              echo '::error::the trusted default-branch guard program is unavailable; refusing to execute PR code' >&2
              exit 1
            fi
          fi
          rm -f "$fetch_error"
          chmod +x ./check-closing-keywords.sh
          ./check-closing-keywords.sh --repo "$GH_REPO" \
            --title-env PR_TITLE --body-env PR_BODY --commits-file "$commits_file"

  verify:
    if: always()
    needs: [lint, security, closing-keywords]
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Never check out or run fork-controlled repository code on this path.
      - name: Verify deliberate skips at the untrusted-fork boundary
        if: env.IS_FORK == 'true'
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CLOSING_KEYWORDS_RESULT: ${{ needs.closing-keywords.result }}
        run: |
          fail=0
          check_skipped() {
            if [ "$2" != "skipped" ]; then
              echo "Job $1 result: $2 (expected skipped for an untrusted fork)"
              fail=1
            fi
          }
          check_skipped lint "$LINT_RESULT"
          check_skipped security "$SECURITY_RESULT"
          if [ "$CLOSING_KEYWORDS_RESULT" != "success" ]; then
            echo "Job closing-keywords result: $CLOSING_KEYWORDS_RESULT (expected success)"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Untrusted fork trust boundary enforced: all repository-controlled jobs were deliberately skipped."
      - if: env.IS_FORK != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs succeeded
        if: env.IS_FORK != 'true'
        env:
          EXPECTED_RESULT: success
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CLOSING_KEYWORDS_RESULT: ${{ needs.closing-keywords.result }}
        run: ./scripts/verify-ci-results.sh "lint=${LINT_RESULT}" "security=${SECURITY_RESULT}" "closing-keywords=${CLOSING_KEYWORDS_RESULT}"
# Keep a literal final line after the inline Jinja conditionals above; with
# trim_blocks enabled, ending on a block tag would strip the workflow's EOF newline.
