name: Build & Validate

on:
  push:
    branches:
      - main
  pull_request:
    # Body/title edits rerun the cheap required closing-keywords.yml guard,
    # plus Tracking Guard and Release Content Guard for eligible PRs. Build
    # stays on code events; closing-keyword edits are checked for every PR.
    # A PR retargeted onto main needs a push or reopen to run Build; required
    # verify/security checks stay pending (fail-closed) until then.
    types: [opened, synchronize, reopened]
    branches:
      - main
  merge_group:
  workflow_dispatch:

# Parallel jobs that all call into the Taskfile so local + CI run identical commands.
# A final `verify` job aggregates statuses for branch protection
# (required checks: verify + security). Every job's toolchain setup goes through
# the shared ./.github/actions/setup composite action.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Both parents of the PR merge ref: first parent is the live base.
          fetch-depth: 2
      - name: Classify docs-only changes (fail closed)
        id: classify
        run: ./scripts/ci-changes-classify.sh >> "$GITHUB_OUTPUT"

  check:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history lets the pin-pair guard compare the PR merge base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
          # test:render-dev-flow exercises render-dev-flow.mjs's secret-scan
          # step, which shells out to gitleaks — without this the new test
          # target below would fail for a missing binary, not a real defect.
          gitleaks: "true"
      - name: Install devkit test tools
        run: |
          # yq comes from the setup action above (lint-tools: "true") — do not
          # re-install it here.
          # renovate: datasource=pypi depName=copier
          COPIER_VERSION=9.19.1
          python -m pip install "copier==${COPIER_VERSION}"
      - name: Lint
        run: task check
      - run: task validate

  # Give the shared suite its own runner and 30-minute budget. Serializing it
  # behind check left validation racing the job timeout after v0.58.0.
  repo-guards:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
          gitleaks: "true"
      - name: Install devkit test tools
        run: |
          # renovate: datasource=pypi depName=copier
          COPIER_VERSION=9.19.1
          python -m pip install "copier==${COPIER_VERSION}"
      # Its own step, outside the suite it guards: it is also a suite member (so
      # `verify` runs it), but deleting the suite step below would delete the
      # only CI step that could notice — this one still fails then.
      - name: Verify-CI parity guard (runs outside the suite it guards)
        run: task test:verify-ci-parity
      - name: Repository guards (every shared test:* target verify runs)
        run: task ci:repo-guards

  # The old lint job serialized ~18–22 minutes of checks. Keep the same
  # Taskfile targets on every code change, in independent runner workspaces.
  # verify requires every test job, including deliberate skips on forks.
  test-contracts:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
          # Test fixtures exercise the secret scan as well as lint tools.
          gitleaks: "true"
      - name: Install devkit test tools
        run: |
          # yq comes from the setup action above (lint-tools: "true") — do not
          # re-install it here.
          # renovate: datasource=pypi depName=copier
          COPIER_VERSION=9.19.1
          python -m pip install "copier==${COPIER_VERSION}"
      # Shared guards run once through repo-guards' ci:repo-guards. These native
      # project checks remain in their independent required jobs.
      - run: task test:dev-flow-stats
      - run: task test:result-schemas
      - run: task test:result-schema-composition
      - run: task test:schema-parity
      - run: task test:finder-normalization
      - run: task test:finder-review
      - run: task test:groom-skill

  test-helpers:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
          # Test fixtures exercise the secret scan as well as lint tools.
          gitleaks: "true"
      - name: Install devkit test tools
        run: |
          # yq comes from the setup action above (lint-tools: "true") — do not
          # re-install it here.
          # renovate: datasource=pypi depName=copier
          COPIER_VERSION=9.19.1
          python -m pip install "copier==${COPIER_VERSION}"
      # Shared guards run once through repo-guards' ci:repo-guards. These native
      # project checks remain in their independent required jobs.
      - run: task test:track-work
      - run: task test:claim-label-resolution
      - run: task test:hooks

  test-skills:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Native readiness tests require ancestry to the PR base.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
          # Test fixtures exercise the secret scan as well as lint tools.
          gitleaks: "true"
      - name: Install devkit test tools
        run: |
          # yq comes from the setup action above (lint-tools: "true") — do not
          # re-install it here.
          # renovate: datasource=pypi depName=copier
          COPIER_VERSION=9.19.1
          python -m pip install "copier==${COPIER_VERSION}"
      # The source project tier owns all skill/agent and dev-flow tests.
      - run: task test

  devcontainer-permissions:
    needs: changes
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true')))
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Devcontainer permissions
        run: task test:devcontainer:permissions

  security:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          gitleaks: "true"
      - name: Secrets scan
        run: task security:secrets
      - name: Dependency audit
        run: task security:audit
      - name: SAST (Semgrep Community Edition)
        run: task security:sast

  verify:
    if: always()
    needs: [changes, check, repo-guards, devcontainer-permissions, test-contracts, test-helpers, test-skills, security]
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      CI_EVENT_NAME: ${{ github.event_name }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      DEVCONTAINER_PERMISSIONS_RESULT: ${{ needs.devcontainer-permissions.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Never check out or run fork-controlled repository code on this path.
      - name: Verify deliberate skips at the untrusted-fork boundary
        if: env.IS_FORK == 'true'
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          REPO_GUARDS_RESULT: ${{ needs.repo-guards.result }}
          TEST_CONTRACTS_RESULT: ${{ needs.test-contracts.result }}
          TEST_HELPERS_RESULT: ${{ needs.test-helpers.result }}
          TEST_SKILLS_RESULT: ${{ needs.test-skills.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          fail=0
          check_skipped() {
            if [ "$2" != "skipped" ]; then
              echo "Job $1 result: $2 (expected skipped for an untrusted fork)"
              fail=1
            fi
          }
          check_skipped changes "$CHANGES_RESULT"
          check_skipped devcontainer-permissions "$DEVCONTAINER_PERMISSIONS_RESULT"
          check_skipped check "$CHECK_RESULT"
          check_skipped repo-guards "$REPO_GUARDS_RESULT"
          check_skipped test-contracts "$TEST_CONTRACTS_RESULT"
          check_skipped test-helpers "$TEST_HELPERS_RESULT"
          check_skipped test-skills "$TEST_SKILLS_RESULT"
          check_skipped security "$SECURITY_RESULT"
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Untrusted fork trust boundary enforced: all repository-controlled jobs were deliberately skipped."
      - if: env.IS_FORK != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs succeeded
        if: env.IS_FORK != 'true'
        env:
          EXPECTED_RESULT: success
          CHECK_RESULT: ${{ needs.check.result }}
          REPO_GUARDS_RESULT: ${{ needs.repo-guards.result }}
          TEST_CONTRACTS_RESULT: ${{ needs.test-contracts.result }}
          TEST_HELPERS_RESULT: ${{ needs.test-helpers.result }}
          TEST_SKILLS_RESULT: ${{ needs.test-skills.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          DOCS_ONLY_JOBS: "devcontainer-permissions"
        run: ./scripts/verify-ci-results.sh "changes=${CHANGES_RESULT}" "devcontainer-permissions=${DEVCONTAINER_PERMISSIONS_RESULT}" "check=${CHECK_RESULT}" "repo-guards=${REPO_GUARDS_RESULT}" "test-contracts=${TEST_CONTRACTS_RESULT}" "test-helpers=${TEST_HELPERS_RESULT}" "test-skills=${TEST_SKILLS_RESULT}" "security=${SECURITY_RESULT}"
# Keep a literal final line after the inline Jinja conditionals above; with
# trim_blocks enabled, ending on a block tag would strip the workflow's EOF newline.
