name: Build & Validate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
  merge_group:
  workflow_dispatch:

# Parallel jobs that all call into the Taskfile so local + CI run identical commands.
# A final `verify` job aggregates statuses for branch protection
# (required checks: verify + security). Every job's toolchain setup goes through
# the shared ./.github/actions/setup composite action.

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
          # test:render-dev-flow exercises render-dev-flow.mjs's secret-scan
          # step, which shells out to gitleaks — without this the new test
          # target below would fail for a missing binary, not a real defect.
          gitleaks: "true"
      - name: Install devkit test tools
        run: |
          # yq comes from the setup action above (lint-tools: "true") — do not
          # re-install it here.
          # renovate: datasource=pypi depName=copier
          COPIER_VERSION=9.17.2
          python -m pip install "copier==${COPIER_VERSION}"
      - name: Lint
        run: task check
      - run: task audit:agent-instructions
      - run: task test:agent-instructions-size
      - run: task test:agent-skill-links
      - run: task validate
      - run: task test:tasks
      # These run in local `verify` and must run here too, or CI is strictly
      # weaker than the local gate (harmon-init#962). Each is a unit test
      # needing no container, network, or credential.
      #
      # NOT here, deliberately: `validate` and `test`. Both are in `verify`
      # unconditionally, but CI only invokes them from the build-test job,
      # which is gated on use_node. So a repo with
      # `(include_terraform or include_ansible) and not use_node` runs real
      # terraform/ansible checks locally and none in CI. Adding them here is
      # not a one-liner — `terraform validate` needs an init step CI does not
      # have — so it is tracked as harmon-init#978 rather than fixed in the
      # same breath as these.
      - run: task audit:agent-instructions
      - run: task test:agent-instructions-size
      - run: task test:agent-skill-links
      - run: task test:output
      - run: task test:meta-install
      - run: task test:session-cleanup
      - run: task test:setup-github
      - run: task test:agent-registry
      # This list is hand-maintained and already misses several task-verify
      # suites (harmon-devkit#726) — added here so this one doesn't join
      # them; #726 tracks fixing the list itself so a future addition can't
      # silently skip CI again.
      - run: task test:dev-flow-stats
      - run: task test:registry-drift
      - run: task test:registry-docs
      - run: task test:label-registry
      - run: task test:codex-review
      # #796's two new suites. Both are wired into `task verify`, but the
      # workflow never runs `task verify` — it runs this hand-maintained
      # list — so without these lines cloud CI passes while skipping every
      # normalization and sandbox regression the change added.
      - run: task test:finder-normalization
      - run: task test:finder-review
      # test:review-skill is the third suite #796 grows — the logical-round cap
      # accounting, union-only finder selection, resolver/exit agreement and
      # closure handling behind criteria 2 and 5. Adding the two above and not
      # this one left that coverage out of cloud CI entirely. All three are
      # point-fixes: #726 is the general fix for a hand-maintained list that
      # silently omits task verify's suites.
      - run: task test:review-skill
      - run: task test:meta-install
      - run: task test:integrate-codex
      - run: task test:ci-results
      - run: task test:status
      - run: task test:gh-scopes
      - run: task test:worktree
      - run: task test:lint-hygiene
      - run: task test:release-title
      - run: task test:track-work
      - run: task test:claim-label-resolution
      - run: task test:notify-release
      - run: task test:setup-github-project
      - run: task test:sync-devkit-release
      - run: task test:hooks
      - run: task test:skills
      - run: task test:agents
      - run: task test:hygiene
      - run: task test:archive-hook
      - run: task test:skill-index-lifecycle
      - run: task test:independence
      - run: task test:statusline
      - run: task test:devcontainer:permissions
      # Same devcontainer gate their `verify` entries carry (#962).
      - run: task test:link-claude-json
      - run: task test:image-staleness
      - run: task test:open-devcontainer
      # This list is otherwise hand-enumerated per-target (see the comment
      # above the first batch), which is a systemic gap tracked as #726 —
      # test:result-schemas has the same omission. Adding only this lane's
      # own target here rather than auditing the whole list.
      - run: task test:render-dev-flow
      - run: task test:devcontainer-changed
      - run: task test:bot-autonomy
      - run: task test:claim-release-merged

  # Metadata-only by design: this executes the trusted default-branch script,
  # queries PR/issue data through read-only APIs, and never checks out a PR.
  # It intentionally runs on forks too; no write-capable credential is present.
  closing-keywords:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: No PR closing-reference check is needed for this trigger
        if: github.event_name != 'pull_request'
        run: echo "Closing-keyword guard applies to pull requests only."
      - name: Require completed issues before a same-repo closing reference
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          commits_file=$(mktemp)
          trap 'rm -f "$commits_file" ./check-closing-keywords.sh' EXIT
          if [ "$PR_COMMITS" -gt 250 ]; then
            echo "::error::PR has ${PR_COMMITS} commits, exceeding the 250-commit API limit; closing-keyword result is indeterminate" >&2
            exit 1
          fi
          gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.message' > "$commits_file"
          fetch_error=$(mktemp)
          fetch_script() {
            gh api -H 'Accept: application/vnd.github.raw' \
              "repos/${GH_REPO}/contents/scripts/check-closing-keywords.sh?ref=$1" \
              > ./check-closing-keywords.sh 2>"$fetch_error"
          }
          # Workflow definitions are taken from the default branch for PRs.
          # Prefer that trusted program even if this PR edits it. The one
          # bootstrap exception lets the introducing PR run only after a
          # confirmed 404, and only for a same-repository head. A fork never
          # executes head-controlled code; network/auth errors never fall back.
          if ! fetch_script "$DEFAULT_BRANCH"; then
            if grep -q '(HTTP 404)' "$fetch_error" && [ "$HEAD_REPO" = "$GH_REPO" ]; then
              echo '::notice::default-branch guard script is absent; using same-repo PR head for bootstrap'
              fetch_script "$HEAD_SHA"
            else
              cat "$fetch_error" >&2
              echo '::error::trusted default-branch guard script is unavailable; refusing to execute PR code' >&2
              exit 1
            fi
          fi
          rm -f "$fetch_error"
          chmod +x ./check-closing-keywords.sh
          ./check-closing-keywords.sh --repo "$GH_REPO" \
            --title-env PR_TITLE --body-env PR_BODY --commits-file "$commits_file"

  security:
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          gitleaks: "true"
      - name: Secrets scan
        run: task security:secrets
      - name: Dependency audit
        run: task security:audit
      - name: SAST (Semgrep Community Edition)
        run: task security:sast

  verify:
    if: always()
    needs: [lint, security, closing-keywords]
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      # Never check out or run fork-controlled repository code on this path.
      - name: Verify deliberate skips at the untrusted-fork boundary
        if: env.IS_FORK == 'true'
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CLOSING_KEYWORDS_RESULT: ${{ needs.closing-keywords.result }}
        run: |
          fail=0
          check_skipped() {
            if [ "$2" != "skipped" ]; then
              echo "Job $1 result: $2 (expected skipped for an untrusted fork)"
              fail=1
            fi
          }
          check_skipped lint "$LINT_RESULT"
          check_skipped security "$SECURITY_RESULT"
          if [ "$CLOSING_KEYWORDS_RESULT" != "success" ]; then
            echo "Job closing-keywords result: $CLOSING_KEYWORDS_RESULT (expected success)"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Untrusted fork trust boundary enforced: all repository-controlled jobs were deliberately skipped."
      - if: env.IS_FORK != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required jobs succeeded
        if: env.IS_FORK != 'true'
        env:
          EXPECTED_RESULT: success
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CLOSING_KEYWORDS_RESULT: ${{ needs.closing-keywords.result }}
        run: ./scripts/verify-ci-results.sh "lint=${LINT_RESULT}" "security=${SECURITY_RESULT}" "closing-keywords=${CLOSING_KEYWORDS_RESULT}"
# Keep a literal final line after the inline Jinja conditionals above; with
# trim_blocks enabled, ending on a block tag would strip the workflow's EOF newline.
