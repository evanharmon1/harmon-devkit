name: Tracking Guard
run-name: tracking-guard checking the PR body

# A closing keyword in a PR body tells GitHub to close that issue on merge, and
# GitHub obeys it exactly. If the issue still holds unticked work, merging deletes
# that work from the backlog — it survives only inside a closed issue nobody
# reads. This guard fails such a PR while the issue is still open and nothing has
# been orphaned yet; `edited` re-runs it, so reworking the body clears the check.
#
# The check itself ships inside the track-work skill (so consumers vendor it with
# the skill) and is unit-tested by `task test:track-work`. See docs/conventions.md.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

concurrency:
  group: tracking-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read the referenced issues' bodies to count unticked items.
  issues: read
  # Read the PR's commit messages.
  pull-requests: read

jobs:
  guard:
    # Skip forks (same gate as build.yml) and automated dependency PRs, whose
    # bodies are generated by their own tool and never carry closing keywords.
    #
    # Known, accepted gaps — this is a mistake-catcher among trusted collaborators,
    # not a security boundary, and the skill at authoring time is the primary
    # mechanism:
    #   * NOT A REQUIRED CHECK. "Branch Protection Ruleset - Protect Main.json"
    #     requires only `verify` and `security` (release-content-guard.yml is not
    #     required either), so a red Tracking Guard is visible but does not block
    #     merge. Making it required first needs the skips below removed — a job
    #     skipped by `if:` never reports, and a required check that never reports
    #     blocks the PR forever, which would deadlock every Renovate PR. Sequence
    #     is: always run the job and self-skip inside it, then add the context to
    #     the ruleset (a maintainer action against live repo settings).
    #   * A FORK PR's body is never checked, yet its closing keywords still close
    #     base-repo issues on merge. Covering it needs the guard to run from
    #     trusted code, since a fork checkout is untrusted — and the usual answer,
    #     `pull_request_target`, is exactly what docs/architecture/security.md
    #     tells these workflows to gate against. Left to maintainer review.
    #   * For a same-repo PR the checkout is the PR ref, so the check runs from
    #     PR-controlled code (as release-content-guard.yml and build.yml already
    #     do). Checking out the base ref instead would be self-protecting, but
    #     would fail any PR that legitimately adds or changes the check.
    #   * A DEPENDENCY-BOT body is never checked, and GitHub would honour a closing
    #     keyword quoted from an upstream changelog. Checked empirically before
    #     accepting this: all four open Renovate PRs at the time — including one
    #     with a 14.6 KB release-notes body — contained no closing-keyword match,
    #     because Renovate renders upstream references as full URLs. Running the
    #     guard on them would exit 2 on any upstream number with no local issue,
    #     blocking the repo's most frequent PR type. Revisit by teaching the check
    #     to treat a 404 as "no local issue to orphan" rather than unverifiable.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.+)$
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect the PR's commit messages
        # Commit messages are a third path to main: they land verbatim under
        # `rebase` and `merge`, and this repo's squash_merge_commit_message is
        # COMMIT_MESSAGES, so they become the squash commit's body too. Written to
        # a file rather than an env var — untrusted multi-line text must not go
        # near $GITHUB_ENV, where a crafted delimiter line is an injection.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json commits \
            --jq '.commits[] | .messageHeadline, .messageBody' \
            > "$RUNNER_TEMP/pr-commits.txt"
      - name: Refuse a title, body, or commit that auto-closes unfinished work
        # Title and body are untrusted input — pass them through the environment
        # (never interpolate into the run script) and only string-match on them.
        # GH_TOKEN is what `gh issue view` uses.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_COMMITS_FILE: ${{ runner.temp }}/pr-commits.txt
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task guard:closing-keywords
