name: Tracking Guard
run-name: tracking-guard checking the PR body

# A closing keyword in a PR body tells GitHub to close that issue on merge, and
# GitHub obeys it exactly. If the issue still holds unticked work, merging deletes
# that work from the backlog — it survives only inside a closed issue nobody
# reads. This guard fails such a PR while the issue is still open and nothing has
# been orphaned yet; `edited` re-runs it, so reworking the body clears the check.
#
# The check itself ships inside the track-work skill (so consumers vendor it with
# the skill) and is unit-tested by `task test:track-work`. See docs/conventions.md.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

concurrency:
  group: tracking-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Read the referenced issues' bodies to count unticked items.
  issues: read

jobs:
  guard:
    # Skip forks (same gate as build.yml) and automated dependency PRs, whose
    # bodies are generated by their own tool and never carry closing keywords.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.+)$
          version: 3.51.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse a body that auto-closes unfinished work
        # The PR body is untrusted input — pass it through the environment (never
        # interpolate into the run script) and only string-match on it. GH_TOKEN
        # is what `gh issue view` authenticates with.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task guard:closing-keywords
