name: Claude Implement
run-name: ${{ github.actor }} is running Claude Implement
# Requires: CLAUDE_CODE_OAUTH_TOKEN secret, plus the CI GitHub App
# (CI_APP_CLIENT_ID variable + CI_APP_PRIVATE_KEY secret). See docs/CHECKLIST.md
# and docs/architecture/security.md.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]
jobs:
  implement:
    # Authorized senders — an explicit allowlist (claude_authorized_members),
    # not org membership. The `if:` gate and the Verify step below both derive
    # from this list, so they stay in sync.
    if: >-
      (github.event.sender.login == 'evanharmon1') &&
      (contains(github.event.comment.body, '@claude implement') ||
       contains(github.event.review.body, '@claude implement') ||
       contains(github.event.issue.body, '@claude implement') ||
       (github.event.action == 'labeled' &&
        github.event.label.name == 'claude-implement'))
    # Runner switch: CI_RUNS_ON repo/org variable unset -> the rendered
    # default; set it to a JSON runner spec to override without a commit.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 180
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      # Defense in depth behind the job-level `if:` sender gate: an explicit
      # step (runs on the runner, unlike the GitHub-evaluated `if:`) that
      # re-asserts the authorized-sender allowlist BEFORE anything privileged
      # runs, so a spoof-shaped gap in the `if:` expression can never even mint
      # a push-capable token, let alone use it. Token-free — mirrors the `if:`.
      - name: Verify sender is authorized
        env:
          SENDER: ${{ github.event.sender.login }}
        run: |
          case "$(printf '%s' "$SENDER" | tr '[:upper:]' '[:lower:]')" in
            "evanharmon1") echo "$SENDER is authorized"; exit 0 ;;
          esac
          echo "::error::$SENDER is not an authorized sender"
          exit 1
      # The narrow token Claude reaches via git/gh: push commits (contents), open
      # PRs (pull-requests), comment (issues) — nothing more, and minted only
      # AFTER the sender is authorized. It lacks workflows:write, so a push that
      # edits .github/workflows/ is rejected by GitHub, keeping a prompt-injected
      # run from rewriting CI.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # Exception to the repo-wide `persist-credentials: false` hardening:
      # this checkout deliberately persists the short-lived narrow CI App token
      # so Claude's `git push` of the working branch can authenticate. The token
      # is least-privilege (minted above) and expires with the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Configure git identity as the CI app bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config --global user.name "$bot"
          git config --global user.email "${bot_id}+${bot}@users.noreply.github.com"
      # Provision the full toolchain Claude needs to run `task verify` (and the
      # git hooks its push triggers): the shared setup action + the lint CLIs
      # that back `task check` and gitleaks for the pre-push `task security`
      # hook.
      - uses: ./.github/actions/setup
        with:
          lint-tools: "true"
          gitleaks: "true"
      - uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        # GH_TOKEN lets Claude's own `gh` calls (e.g. `gh pr create`)
        # authenticate as the CI app bot with the narrow token, matching the git
        # identity above.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          trigger_phrase: "@claude implement"
          label_trigger: "claude-implement"
          track_progress: true
          base_branch: main
          branch_prefix: claude/
          branch_name_template: "{{prefix}}issue-{{entityNumber}}-{{description}}-{{sha}}"
          # --max-budget-usd caps API-key spend; likely a no-op under
          # CLAUDE_CODE_OAUTH_TOKEN (subscription) billing. Real runaway guards
          # are timeout-minutes (job-level) and --max-turns.
          # --allowedTools grants the file-editing tools plus a SCOPED Bash
          # allowlist (space-separated `Bash(cmd *)` form per the Claude Code
          # settings reference): the project runners, git, gh, and read-only
          # inspection utilities — enough to implement a change, run
          # `task verify`, commit, push, and open a PR. Deliberately NOT allowed:
          # curl/wget (not needed; removing easy callback/exfiltration paths),
          # rm/chmod/sudo, and arbitrary `bash -c`/`eval`. Claude edits files via
          # the Edit/Write tools or `task` targets. Prefix matching is coarse and
          # shell can compose, so this is defense-in-depth, not a hard sandbox —
          # the real boundaries are the narrow token, branch protection, and the
          # ephemeral runner. Widen if a real run stalls on a denied command.
          # The single allowedTools token cannot be wrapped without changing it.
          # yamllint disable rule:line-length
          # --disallowedTools denies the draft→ready promotion the prompt below
          # forbids. Deny rules beat allow rules, so this is a real control and
          # not only prompt text — but it is the same coarse prefix matching as
          # --allowedTools, so shell composition still gets around it. It raises
          # the cost of a mistaken or injected promotion; the boundary that
          # actually holds is branch protection (the bot cannot merge).
          # All three pattern forms are listed deliberately: the bare command,
          # the documented `:*` prefix form, and the space-glob form the
          # allowlist below uses. A deny rule that matches nothing is worse than
          # none — it reads as a control while allowing the command outright.
          claude_args: >-
            --model opus --effort high --max-budget-usd 25 --max-turns 200
            --disallowedTools "Bash(gh pr ready)" "Bash(gh pr ready:*)" "Bash(gh pr ready *)"
            --allowedTools "Edit,MultiEdit,Write,Read,NotebookEdit,Glob,Grep,LS,TodoWrite,Bash(task *),Bash(pnpm *),Bash(npx *),Bash(node *),Bash(git *),Bash(gh *),Bash(cd *),Bash(ls *),Bash(cat *),Bash(head *),Bash(tail *),Bash(grep *),Bash(rg *),Bash(find *),Bash(sed *),Bash(awk *),Bash(jq *),Bash(wc *),Bash(sort *),Bash(diff *),Bash(echo *),Bash(mkdir *),Bash(cp *),Bash(mv *),Bash(which *),Bash(pwd)"
          # yamllint enable rule:line-length
          prompt: |
            Implement the change requested in this issue or comment.

            Operating rules (non-negotiable):
            - Do NOT ask clarifying questions. Pick the most reasonable
              interpretation of the request and proceed. State any non-obvious
              assumptions in the PR body so the reviewer can redirect if needed.
            - The deliverable is ONE opened DRAFT pull request on a claude/...
              branch — on the success path and the blocked path alike. The draft
              is the agent workbench (AGENTS.md, "Dev Loop"), not a failure
              signal; the two paths differ in PR body content, not draft state.
              Do NOT end by leaving a summary comment on the issue.
            - NEVER run `gh pr ready`. This workflow cannot complete the
              readiness gate — it runs headless as the CI app bot and cannot
              drive the current-head review cycle a human handoff requires — so
              promoting here would make "non-draft" stop meaning "ready for a
              human". Promotion belongs to a shepherd session.
            - NEVER merge and never push to main, whatever CI says.
            - If `task verify` fails and you cannot resolve it within several
              attempts, commit the best-effort state, push the branch, open the
              draft PR anyway, and describe the failing step under a "## Blocked"
              heading in the body. Do not abandon the branch or dump a diff in a
              comment.

            Workflow:
            1. Make the code changes directly in the working tree.
            2. Run `task verify` and fix any failures before continuing.
            3. Commit with a conventional-commits message referencing this issue.
            4. Push the branch to origin.
            5. Open the pull request targeting main with `gh pr create --draft`.
               In the body, link to this issue with
               "Closes #${{ github.event.issue.number || github.event.pull_request.number }}", summarize
               what changed, note anything reviewers should pay attention to, and
               say the PR is a draft awaiting shepherding. Confirm it with
               `gh pr view <n> --json isDraft,headRefOid`: isDraft must be true
               and the SHA must be the one you just pushed.
            6. Watch the PR's checks with `gh pr checks <n> --watch`. Fix what
               you can fix mechanically — commit, push, watch again — for at most
               3 such rounds. The PR stays draft throughout.
            7. Stop and report: the PR URL, the gates you ran, what CI said, and
               what a shepherd session still has to settle (remaining check
               failures, unanswered review findings). A draft handed over with a
               clear report is a complete, successful run.

            Do not post the diff as a comment. The PR is the deliverable.

            Follow the conventions documented in AGENTS.md, including the
            commit-message style and the draft-PR lifecycle.
