name: Task
description: General work — maintenance, chores, cleanup, or a small improvement
assignees:
  - evanharmon1
labels:
  - task
  - needs-triage
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Briefly describe the task and the outcome it should achieve.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Optional. One `- [ ]` item per criterion; tag `[CI]`/`[HUMAN]` where
        useful. Leave blank to file without criteria — triage adds them
        before this is dispatched.
  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: >-
        A command that re-establishes whether the claims above still hold, and what its output
        means. Add one whenever this issue cites a `file:line` or says "currently…" — those go
        stale, and without a way to re-check, a reader months from now cannot tell a stale claim
        from a live one. Strongest form: a test assertion that fails today.
      placeholder: |
        ```sh
        task test:hygiene
        ```
        A failing assertion means the violation is still live.
  - type: textarea
    id: context
    attributes:
      label: Additional context
