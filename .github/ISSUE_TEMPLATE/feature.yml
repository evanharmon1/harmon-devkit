name: Feature
description: Suggest a new capability or improvement
assignees:
  - evanharmon1
labels:
  - feature
  - needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? (e.g. "I'm frustrated when …")
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >-
        Optional. One `- [ ]` item per criterion; tag `[CI]`/`[HUMAN]` where
        useful. Leave blank to file without criteria — triage adds them
        before this is dispatched.
  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: >-
        A command that re-establishes whether the claims above still hold, and what its output
        means. Add one whenever this issue cites a `file:line` or says "currently…" — those go
        stale, and without a way to re-check, a reader months from now cannot tell a stale claim
        from a live one. Strongest form: a test assertion that fails today.
      placeholder: |
        ```sh
        grep -n 'skipped' .github/workflows/terraform.yml
        ```
        Any hit inside the result aggregation means the violation is still live.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
