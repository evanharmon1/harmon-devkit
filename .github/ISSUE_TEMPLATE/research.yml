name: Research
description: Track a research question or investigation
assignees:
  - evanharmon1
labels:
  - research
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        **Deliverable:** a research issue concludes in a **decision record** — an
        ADR in `docs/decisions/` (see `docs/conventions.md`). Track the
        investigation here; close it once the ADR is merged.
  - type: textarea
    id: question
    attributes:
      label: Problem
      description: The research question to answer — what is being investigated, and what decision will it inform?
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: Background / context
      description: What do we already know, and why is this worth investigating?
  - type: textarea
    id: verify
    attributes:
      label: Verify
      description: >-
        A command that re-establishes whether the background above still holds, and what its
        output means. Research issues age fastest — they describe a current state by definition —
        so without a way to re-check, a reader cannot tell which findings are still true.
      placeholder: |
        ```sh
        gh api repos/{owner}/{repo}/rulesets --jq '.[].name'
        ```
        No `terraform-verify` in the output means the gap is still open.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in scope and out of scope.
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: The decision to be made and recorded as an ADR, plus any supporting artifacts.
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Resources / references
  - type: checkboxes
    id: done
    attributes:
      label: Definition of done
      options:
        - label: Decision recorded as an ADR in docs/decisions/
