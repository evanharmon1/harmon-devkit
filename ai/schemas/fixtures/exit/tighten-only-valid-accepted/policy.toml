schema_version = 2
default_rigor = "standard"
rigor_order = ["cursory", "light", "standard", "thorough", "deep", "forensic"]
tier_order = ["standard"]

[convergence]
converged = { all = [ { predicate = "no_gating_findings" } ] }
diverging = { any = [ { predicate = "repeat_after_fix" }, { predicate = "count_rising", increases = 3 } ] }

[rigor.standard]
rounds = "standard"
breadth = "standard"
orchestrator_tier = "standard"
implementer_tier = "standard"
challenger_tier = "standard"
reviewer_tier = "standard"
integrator_tier = "standard"

[rigor.standard.convergence]
converged = { all = [ { predicate = "no_gating_findings" }, { predicate = "provenance_share", min = 0.9 } ] }
diverging = { any = [ { predicate = "repeat_after_fix" }, { predicate = "count_rising", increases = 1 } ] }

[rounds.standard]
challenge = 1
review = 1
integration = 1
min_rounds = 1

[breadth.standard]
max_agent_runs = 4
max_parallel_agents = 1

[gates]
round_code = "verify"
round_docs = "check"
secret_scan = "security:secrets"
pre_pr = "security"
docs_only_paths = ["docs/**"]

[role.orchestrator]
families = ["claude"]
[role.implementer]
families = ["claude"]
[role.challenger]
families = ["gpt"]
[role.reviewer]
families = ["gpt"]
[role.integrator]
families = ["claude"]

[stage.challenge]
finders = ["codex-cli"]
[stage.review]
finders = ["codex-cli"]
[stage.integration]
finders = ["codex-cli"]
