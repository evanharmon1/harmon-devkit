schema_version = 2
default_rigor = "cursory"
default_strategy = "council"
rigor_order = ["cursory", "light", "standard", "thorough", "deep", "forensic"]
tier_order = ["local", "economy", "standard", "frontier", "apex"]

[convergence]
converged = { all = [ { predicate = "no_gating_findings" } ] }
diverging = { any = [
  { all = [ { predicate = "count_rising", increases = 2 }, { predicate = "repeat_after_fix" } ] },
  { predicate = "provenance_share", min = 0.5 },
] }

[rigor.cursory]
rounds = "cursory"
breadth = "cursory"
orchestrator_tier = "standard"
implementer_tier = "standard"
challenger_tier = "standard"
reviewer_tier = "standard"
integrator_tier = "standard"

[rounds.cursory]
challenge = 1
review = 1
integration = 1
remediation = 1
min_rounds = 1
wall_clock_min = 240

[breadth.cursory]
max_agent_runs = 1
max_parallel_agents = 1

[gates]
round_code = "verify"
round_docs = "check"
secret_scan = "security:secrets"
pre_pr = "security"
docs_only_paths = ["docs/**"]

[role.orchestrator]
families = ["claude"]
[role.implementer]
families = ["claude"]
[role.challenger]
families = ["gpt"]
[role.reviewer]
families = ["gpt"]
[role.integrator]
families = ["claude"]

[stage.challenge]
finders = ["codex-cli"]
[stage.review]
finders = ["codex-cli"]
[stage.integration]
finders = ["codex-cli"]

[strategy.council]
topology = "independent-proposals"
min_agents = 2
distinct_families = true
selection = "judge"
synthesis = "true"
