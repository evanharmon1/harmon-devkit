# Bot-profile BOUNDARY policy, installed to /etc/codex/managed_config.toml.
# Structurally derived from codex-managed-config.toml (the shared human/bot
# baseline): every key here matches that file except sandbox_mode and
# approval_policy, enforced by scripts/test-bot-autonomy.sh's structural
# parity test. Docker is the outer isolation boundary in this profile, so
# there is no nested sandbox and no interactive approval prompt.
#
# Same rule as the shared file: this is Codex's legacy MDM layer, so every key
# is an unoverridable requirement. Overridable defaults live in
# codex-system-config.toml (/etc/codex/config.toml). See harmon-init#1186.
sandbox_mode = "danger-full-access"
approval_policy = "never"
approvals_reviewer = "auto_review"

[features]
hooks = true

# Managed hooks are deliberately limited to policies implemented entirely by
# image-owned scripts. Startup/context and formatter hooks delegate into the
# checkout's Taskfile, so they remain Claude/project-trusted behavior instead
# of becoming system-trusted Codex startup code.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/claude-compat.sh /etc/claude-code/hooks/block-no-verify.sh"
timeout = 20

[[hooks.PreToolUse]]
matcher = "Edit|Write"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/file-payload.sh /etc/claude-code/hooks/protect-files.sh"
timeout = 20
