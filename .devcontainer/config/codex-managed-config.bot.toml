# Bot-profile managed config. Structurally derived from
# codex-managed-config.toml (the shared human/bot baseline): every key here
# matches that file except sandbox_mode and approval_policy, enforced by
# scripts/test-bot-autonomy.sh's structural parity test. Docker is the outer
# isolation boundary in this profile, so there is no nested sandbox and no
# interactive approval prompt.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
project_doc_max_bytes = 65536
sandbox_mode = "danger-full-access"
approval_policy = "never"
approvals_reviewer = "auto_review"

[features]
hooks = true

[tui]
status_line = [
  "project-name",
  "git-branch",
  "model-with-reasoning",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "used-tokens",
  "run-state",
]

# Managed hooks are deliberately limited to policies implemented entirely by
# image-owned scripts. Startup/context and formatter hooks delegate into the
# checkout's Taskfile, so they remain Claude/project-trusted behavior instead
# of becoming system-trusted Codex startup code.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/claude-compat.sh /etc/claude-code/hooks/block-no-verify.sh"
timeout = 20

[[hooks.PreToolUse]]
matcher = "Edit|Write"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/etc/codex/hooks/file-payload.sh /etc/claude-code/hooks/protect-files.sh"
timeout = 20
